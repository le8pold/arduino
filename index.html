<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>msg.hylton.onl</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #gate {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }
    .input-group {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 250px; 
    }
    input {
        height: 40px;
        line-height: 40px;
        padding: 0 5px;
        border: 2px solid black;
        font-size: 18px;
        text-align: center;
        outline: none;
        background: white;
        font-family: Arial, sans-serif;
    }
    #initInput {
        width: 40px;
        text-transform: uppercase;
    }
    #msgInput {
        width: 164px;
    }
    .separator {
        font-weight: bold;
        font-size: 18px;
    }
    button {
        width: 250px;
        height: 44px;
        padding: 10px;
        font-size: 16px;
        border: 2px solid black;
        background: white;
        cursor: pointer;
        font-family: Arial, sans-serif;
        text-transform: uppercase;
        transition: 0.2s;
    }
    button:hover:not(:disabled) {
        background: black;
        color: white;
    }
    button.buzz-btn {
        color: rgb(255, 0, 0);
        border-color: rgb(255, 0, 0);
    }
    button.buzz-btn:hover:not(:disabled) {
        background: rgb(255, 0, 0);
        color: white;
    }
    button:disabled {
        cursor: default;
        background: white;
        color: black;
    }
    button.error-state {
        color: rgb(255, 0, 0);
        border-color: black;
    }
    button.success-state {
        color: rgb(0, 150, 0);
        border-color: black;
    }
</style>
</head>
<body>
<div id="gate">
    <div class="input-group">
        <input type="text" id="initInput" placeholder="" maxlength="2" onfocus="resetUI()">
        <span class="separator">:</span>
        <input type="text" id="msgInput" placeholder="" maxlength="13" onfocus="resetUI()">
    </div>
    <button id="sendBtn" onclick="sendMessage(false)">SEND MESSAGE</button>
    <button id="buzzBtn" class="buzz-btn" onclick="sendMessage(true)">BUZZ ME</button>
    <p style="margin-top: 10px; font-size: 14px; color: black; font-family: Arial, sans-serif;">put your initials on the left, message on the right.</p>
    <p style="margin-top: 10px; font-size: 14px; color: black; font-family: Arial, sans-serif;">made by leo. v2.0.3</p>
</div>
<script>
    const initEl = document.getElementById("initInput");
    const msgEl = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const buzzBtn = document.getElementById("buzzBtn");
    
    const WORKER_URL = 'https://rough-mouse-d68b.hylton-leopold.workers.dev'; 

    let isProcessing = false;

    function resetUI() {
        sendBtn.textContent = "SEND MESSAGE";
        buzzBtn.textContent = "BUZZ ME";
        sendBtn.disabled = false;
        buzzBtn.disabled = false;
        sendBtn.classList.remove("error-state", "success-state");
        buzzBtn.classList.remove("error-state", "success-state");
        isProcessing = false;
    }

    async function sendMessage(shouldBuzz) {
        const initials = initEl.value.trim().toUpperCase() || "??";
        let msgText = msgEl.value.trim();
        
        if (shouldBuzz && !msgText) {
            msgText = "BUZZ";
        }
        
        if (!msgText || isProcessing) return;
        
        const message = `${initials}:${msgText}`; 
        
        isProcessing = true;
        sendBtn.disabled = true;
        buzzBtn.disabled = true;

        const activeBtn = shouldBuzz ? buzzBtn : sendBtn;

        const frames = ['|', '/', '-', '\\'];
        let i = 0;
        const spinnerInterval = setInterval(() => {
            i = (i + 1) % frames.length;
            activeBtn.textContent = frames[i];
        }, 100);

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, buzz: shouldBuzz })
            });

            clearInterval(spinnerInterval);

            isProcessing = false;
            sendBtn.disabled = false;
            buzzBtn.disabled = false;

            if (response.ok) {
                activeBtn.textContent = shouldBuzz ? "BUZZ SENT" : "MESSAGE SENT";
                activeBtn.classList.add("success-state");
                initEl.value = "";
                msgEl.value = "";
            } else {
                throw new Error();
            }

        } catch (error) {
            clearInterval(spinnerInterval);
            
            isProcessing = false;
            sendBtn.disabled = false;
            buzzBtn.disabled = false;
            
            activeBtn.classList.add("error-state");
            activeBtn.textContent = "SEND FAILED";
        }
    }

    initEl.addEventListener("keypress", function(e) { if (e.key === "Enter") sendMessage(false); });
    msgEl.addEventListener("keypress", function(e) { if (e.key === "Enter") sendMessage(false); });
</script>
</body>
</html>
